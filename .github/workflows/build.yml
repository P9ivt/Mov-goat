name: Build MOV goat APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
          cache-dependency-path: 'android/**/*.gradle*'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate app icon from the logo image
        run: |
          pip install pillow
          python - <<'PY'
          import os, sys
          from PIL import Image, ImageDraw, ImageFilter

          exts = ('.png', '.jpg', '.jpeg', '.webp')
          cands = [f for f in os.listdir('.') if os.path.isfile(f) and f.lower().endswith(exts)]
          cands.sort(key=lambda f: (not f.lower().startswith('logo'), f.lower()))
          if not cands:
              print('NO LOGO IMAGE FOUND IN REPO ROOT - building with the default icon')
              sys.exit(0)
          print('Using logo image:', cands[0])

          src = Image.open(cands[0]).convert('RGB')
          w, h = src.size
          s = min(w, h)
          left, top = (w - s) // 2, (h - s) // 2
          src = src.crop((left, top, left + s, top + s))

          base = 'android/app/src/debug/res'

          # Adaptive foreground: 432x432 canvas, logo fills the 288px visible window
          vis = src.resize((288, 288), Image.LANCZOS)
          canvas = Image.new('RGB', (432, 432))
          canvas.paste(vis, (72, 72))
          canvas.paste(vis.crop((0, 0, 288, 1)).resize((288, 72)), (72, 0))
          canvas.paste(vis.crop((0, 287, 288, 288)).resize((288, 72)), (72, 360))
          canvas.paste(vis.crop((0, 0, 1, 288)).resize((72, 288)), (0, 72))
          canvas.paste(vis.crop((287, 0, 288, 288)).resize((72, 288)), (360, 72))
          for x, y, p in [(0, 0, (0, 0)), (360, 0, (287, 0)), (0, 360, (0, 287)), (360, 360, (287, 287))]:
              canvas.paste(Image.new('RGB', (72, 72), vis.getpixel(p)), (x, y))
          blurred = canvas.filter(ImageFilter.GaussianBlur(14))
          mask = Image.new('L', (432, 432), 255)
          ImageDraw.Draw(mask).rectangle([72, 72, 359, 359], fill=0)
          mask = mask.filter(ImageFilter.GaussianBlur(3))
          fg = Image.composite(blurred, canvas, mask)
          os.makedirs(base + '/drawable-nodpi', exist_ok=True)
          fg.save(base + '/drawable-nodpi/movgoat_icon_fg.png')

          # Legacy icons (older Android): rounded square and circle
          def shaped(size, kind):
              big = size * 4
              img = src.resize((big, big), Image.LANCZOS).convert('RGBA')
              m = Image.new('L', (big, big), 0)
              d = ImageDraw.Draw(m)
              if kind == 'round':
                  d.ellipse([0, 0, big - 1, big - 1], fill=255)
              else:
                  d.rounded_rectangle([0, 0, big - 1, big - 1], radius=int(big * 0.22), fill=255)
              img.putalpha(m)
              return img.resize((size, size), Image.LANCZOS)

          for dpi, px in [('mdpi', 48), ('hdpi', 72), ('xhdpi', 96), ('xxhdpi', 144), ('xxxhdpi', 192)]:
              d = base + '/mipmap-' + dpi
              os.makedirs(d, exist_ok=True)
              shaped(px, 'square').save(d + '/ic_launcher.png')
              shaped(px, 'round').save(d + '/ic_launcher_round.png')

          # Adaptive icon definitions (v26 and v33)
          xml = (
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n'
              '    <background android:drawable="@android:color/white"/>\n'
              '    <foreground android:drawable="@drawable/movgoat_icon_fg"/>\n'
              '</adaptive-icon>\n'
          )
          for v in ('v26', 'v33'):
              d = base + '/mipmap-anydpi-' + v
              os.makedirs(d, exist_ok=True)
              for n in ('ic_launcher.xml', 'ic_launcher_round.xml'):
                  with open(d + '/' + n, 'w', encoding='utf-8') as f:
                      f.write(xml)

          print('Icon files generated under', base)
          PY

      - name: Fetch upstream sources
        run: |
          chmod +x scripts/fetch-upstream.sh
          ./scripts/fetch-upstream.sh

      - name: Align AGP & Kotlin versions in android build files
        run: |
          python - <<'PY'
          import glob, re

          # Update common AGP / Kotlin version declarations if present
          for path in glob.glob('android/**/*.gradle*', recursive=True) + glob.glob('android/**/libs.versions.toml', recursive=True):
              with open(path, 'r', encoding='utf-8', errors='ignore') as f:
                  txt = f.read()
              orig = txt
              txt = re.sub(r'(agp\s*=\s*")[^"]+(")', r'\g<1>8.7.3\g<2>', txt)
              txt = re.sub(r'(kotlin\s*=\s*")[^"]+(")', r'\g<1>2.0.21\g<2>', txt)
              txt = re.sub(r'(com\.android\.application["\']?\s*version\s*["\']?)[^"\']+', r'\g<1>8.7.3', txt)
              txt = re.sub(r'(org\.jetbrains\.kotlin\.android["\']?\s*version\s*["\']?)[^"\']+', r'\g<1>2.0.21', txt)
              if txt != orig:
                  with open(path, 'w', encoding='utf-8') as f:
                      f.write(txt)
                  print('Updated:', path)

          props_path = 'android/gradle.properties'
          try:
              with open(props_path, 'r', encoding='utf-8', errors='ignore') as f:
                  props = f.read()
          except FileNotFoundError:
              props = ''

          additions = [
              'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g',
              'android.enableR8.fullMode=false'
          ]
          for line in additions:
              key = line.split('=')[0]
              if key not in props:
                  props += ('\n' if props and not props.endswith('\n') else '') + line + '\n'

          with open(props_path, 'w', encoding='utf-8') as f:
              f.write(props)
          print('Ensured gradle.properties settings')
          PY

      - name: Build debug APK
        working-directory: android
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g"
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-build-cache --stacktrace

      - name: List APK files
        run: find android -path '*outputs/apk/debug/*.apk'

      - uses: actions/upload-artifact@v4
        with:
          name: movgoat-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
